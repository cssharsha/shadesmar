syntax = "proto3";

package core.proto;

import "core/proto/geometry.proto";

message GaussianSplat {
    // Unique identifier for this splat
    uint32 id = 1;
    
    // 3D position (mean μ)
    Vector3 position = 2;
    
    // 3x3 covariance matrix Σ (stored as 9 elements in row-major order)
    repeated double covariance = 3;  // Should have exactly 9 elements

    // Opacity/alpha value [0.0, 1.0]
    float opacity = 4;

    // Optional: Link to source keypoint that generated this splat
    uint32 source_keypoint_id = 5;

    // Optional: Confidence/quality metric for this splat
    float confidence = 6;

    // Timestamp when this splat was created
    double timestamp = 7;

    // 3D scaling vector
    Vector3 scale = 8;

    // Rotation as a quaternion (w, x, y, z)
    Quaternion rotation = 9;

    // Spherical harmonics DC component (0th degree, 1st coefficient)
    // This represents the base color in spherical harmonics space
    // To convert to RGB: color = sh_dc * C0 + 0.5, where C0 = 0.28209479177387814
    Vector3 sh_dc = 10;

    // Higher order spherical harmonics coefficients (degrees 1-3)
    // Layout: [sh1_r, sh1_g, sh1_b, sh2_r, sh2_g, sh2_b, ..., sh15_r, sh15_g, sh15_b]
    // For degree d, total coefficients = (d+1)^2
    // Degree 0: 1 coeff (DC, stored in sh_dc)
    // Degree 1: 3 coeffs × 3 RGB = 9 values
    // Degree 2: 5 coeffs × 3 RGB = 15 values
    // Degree 3: 7 coeffs × 3 RGB = 21 values
    // Total for degree 3: 15 higher-order coeffs × 3 = 45 values
    repeated float sh_rest = 11;

    // Degree of spherical harmonics (typically 0-3)
    int32 sh_degree = 12;
}

message GaussianSplatBatch {
    // Batch identifier
    uint32 batch_id = 1;
    
    // All splats in this batch
    repeated GaussianSplat splats = 2;
    
    // Keyframe range that this batch was generated from
    uint64 start_keyframe_id = 3;
    uint64 end_keyframe_id = 4;
    
    // Batch creation timestamp
    double timestamp = 5;
    
    // Total number of splats in batch
    uint32 splat_count = 6;
    
    // Set of keyframe IDs that generated this batch
    repeated uint64 source_keyframe_ids = 7;
}

message ProcessStatus {
    // Last processed keyframe ID by this process
    uint64 last_processed_keyframe_id = 1;
    
    // Last processed splat batch ID by this process
    uint32 last_processed_splat_batch_id = 2;
    
    // Process timestamp
    double timestamp = 3;
    
    // Process name/identifier
    string process_name = 4;
    
    // Process health status
    bool is_healthy = 5;
    
    // Optional: Additional status information
    string status_message = 6;
}